identity:
  name: AI Flywheel Framework
  purpose: Official installable implementation of the AI Flywheel specification.
  status: approved
repository:
  type: framework-distribution
  primary_users:
    - AI-assisted software engineering teams
    - AI Flywheel CLI
architecture:
  summary: Stores versioned templates, schemas, walkthrough content, migrations, fixtures, and framework documentation.
  boundaries:
    - The root .flywheel directory governs development of this repository.
    - Distributable assets must live outside the root .flywheel directory.
    - CLI executable and runtime code belong in Infoconex/ai-flywheel-cli.
validation:
  commands: []
constraints:
  - Do not commit directly to main.
  - Do not enable GitHub-hosted execution without human approval.
protected_paths:
  - .flywheel/governance.yaml
  - templates/
  - schemas/
risks:
  - Confusing repository governance files with distributable templates.
documentation_sources:
  - https://github.com/Infoconex/ai-flywheel-spec
  - https://github.com/Infoconex/ai-flywheel-0.3.0-sample
