schema_version: 1
id: 003-define-and-approve-implementation
title: Define and Approve Implementation
status: blocked
blocked_by:
  - 002-inspect-and-reconcile-repository
objective: Select the capabilities and propose the repository-specific implementation for human approval.
procedure:
  - Classify capabilities as required, selected, deferred, rejected, or repository-defined.
  - Propose language, runtime, architecture, source location, command interface, persistence, logging, testing, and dependency choices.
  - Explain how the proposal follows repository context and standards.
  - Obtain required human approval before implementation begins.
acceptance_criteria:
  - capabilities.yaml records all capability decisions and rationale.
  - A complete implementation proposal is persisted.
  - Material decisions have explicit human approval.
evidence_required:
  - Updated capabilities.yaml
  - Approved implementation proposal
