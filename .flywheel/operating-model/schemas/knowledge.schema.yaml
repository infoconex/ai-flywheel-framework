$schema: https://json-schema.org/draft/2020-12/schema
$id: knowledge.schema.yaml
type: object
additionalProperties: false
required: [schema_version, id, status, statement, applicability, limitations, evidence_refs, validated_at, validated_by, reuse_guidance, supersedes]
properties:
  schema_version: {type: integer, const: 1}
  id: {type: string, minLength: 1}
  status: {type: string, enum: [candidate, validated, deprecated, superseded, rejected]}
  statement: {type: string, minLength: 1}
  applicability:
    type: array
    minItems: 1
    items: {type: string, minLength: 1}
  limitations:
    type: array
    items: {type: string, minLength: 1}
  evidence_refs:
    type: array
    minItems: 1
    uniqueItems: true
    items: {type: string, minLength: 1}
  validated_at: {type: [string, 'null'], format: date-time}
  validated_by: {type: [string, 'null'], minLength: 1}
  reuse_guidance: {type: string, minLength: 1}
  supersedes:
    type: array
    uniqueItems: true
    items: {type: string, minLength: 1}
allOf:
  - if:
      properties: {status: {const: validated}}
      required: [status]
    then:
      properties:
        validated_at: {type: string, format: date-time}
        validated_by: {type: string, minLength: 1}
