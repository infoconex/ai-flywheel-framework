$schema: https://json-schema.org/draft/2020-12/schema
$id: startup-failure.schema.yaml
type: object
additionalProperties: false
required: [schema_version, id, observed_revision, branch, operator, occurred_at, failed_rules, artifact_paths, evidence, recovery_action, orphaned_execution_id]
properties:
  schema_version: {type: integer, const: 1}
  id: {type: string, pattern: '^SF-[0-9]{8}T[0-9]{6}Z-[0-9]{3}$'}
  observed_revision: {type: string, pattern: '^[0-9a-f]{40}$'}
  branch: {type: [string, 'null']}
  operator: {type: string, minLength: 1}
  occurred_at: {type: string, format: date-time, pattern: '^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z$'}
  failed_rules:
    type: array
    minItems: 1
    uniqueItems: true
    items: {type: string, minLength: 1}
  artifact_paths:
    type: array
    minItems: 1
    uniqueItems: true
    items: {type: string, minLength: 1}
  evidence:
    type: array
    minItems: 1
    items: {type: string, minLength: 1}
  recovery_action: {type: string, minLength: 1}
  orphaned_execution_id:
    type: [string, 'null']
    pattern: '^EX-[0-9]{8}T[0-9]{6}Z-[0-9]{3}$'