$schema: https://json-schema.org/draft/2020-12/schema
$id: goal.schema.yaml
type: object
required: [schema_version, id, title, status, objective, acceptance_criteria]
properties:
  schema_version: {type: integer, const: 1}
  id: {type: string, minLength: 1}
  title: {type: string, minLength: 1}
  status: {type: string, enum: [proposed, blocked, active, completed, cancelled]}
  objective: {type: string, minLength: 1}
  depends_on:
    type: array
    items: {type: string}
  acceptance_criteria:
    type: array
    minItems: 1
    items:
      type: object
      required: [id, statement]
      additionalProperties: false
      properties:
        id: {type: string, pattern: '^AC-[0-9]{3,}$'}
        statement: {type: string, minLength: 1}
  evidence_required:
    type: array
    items:
      type: object
      required: [criterion_id]
      properties:
        criterion_id: {type: string}
        artifacts: {type: array, items: {type: string}}
        evidence_types: {type: array, items: {type: string}}
        artifact_refs: {type: array, items: {type: string}}