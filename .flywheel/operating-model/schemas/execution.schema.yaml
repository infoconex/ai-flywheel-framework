$schema: https://json-schema.org/draft/2020-12/schema
$id: execution.schema.yaml
type: object
additionalProperties: false
required: [schema_version, id, mission_id, goal_id, status, intended_outcome, acceptance_criteria, started_at, completed_at, lifecycle, actions, observations, classifications, adaptations, blockers, approval_refs, evidence_refs, decision_refs, finding_refs, validation_results, outcome, completion]
properties:
  schema_version: {type: integer, const: 1}
  id: {type: string, pattern: '^EX-[0-9]{8}T[0-9]{6}Z-[0-9]{3}$'}
  mission_id: {type: string, minLength: 1}
  goal_id: {type: string, minLength: 1}
  status: {type: string, enum: [in-progress, blocked, interrupted, succeeded, partially-succeeded, failed, abandoned]}
  intended_outcome: {type: string, minLength: 1}
  acceptance_criteria:
    type: array
    minItems: 1
    uniqueItems: true
    items: {type: string, pattern: '^AC-[0-9]{3,}$'}
  started_at: {type: string, format: date-time, pattern: '^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z$'}
  completed_at: {type: [string, 'null'], format: date-time}
  lifecycle: {$ref: '#/$defs/lifecycle'}
  actions: {type: array, items: {type: string, minLength: 1}}
  observations: {type: array, items: {type: string, minLength: 1}}
  classifications: {type: array, items: {type: string, minLength: 1}}
  adaptations: {type: array, items: {type: string, minLength: 1}}
  blockers:
    type: array
    uniqueItems: true
    items: {type: string, minLength: 1}
  approval_refs:
    type: array
    uniqueItems: true
    items: {type: string, minLength: 1}
  evidence_refs:
    type: array
    uniqueItems: true
    items: {type: string, minLength: 1}
  decision_refs:
    type: array
    uniqueItems: true
    items: {type: string, minLength: 1}
  finding_refs:
    type: array
    uniqueItems: true
    items: {type: string, minLength: 1}
  validation_results:
    type: array
    items: {$ref: '#/$defs/validation_result'}
  outcome: {type: [string, 'null']}
  completion:
    type: object
    additionalProperties: false
    required: [disposition, rationale]
    properties:
      disposition: {type: [string, 'null'], enum: [goal-completed, goal-continues, goal-blocked, goal-failed, goal-cancelled, null]}
      rationale: {type: [string, 'null']}
allOf:
  - if: {properties: {status: {const: in-progress}}, required: [status]}
    then:
      properties:
        completed_at: {type: 'null'}
        outcome: {type: 'null'}
        lifecycle: {$ref: '#/$defs/lifecycle_active'}
        completion:
          properties:
            disposition: {type: 'null'}
            rationale: {type: 'null'}
  - if: {properties: {status: {const: blocked}}, required: [status]}
    then:
      properties:
        completed_at: {type: 'null'}
        blockers: {minItems: 1}
        lifecycle: {$ref: '#/$defs/lifecycle_active'}
        completion:
          properties:
            disposition: {type: 'null'}
            rationale: {type: 'null'}
  - if: {properties: {status: {const: interrupted}}, required: [status]}
    then:
      properties:
        completed_at: {type: 'null'}
        outcome: {type: string, minLength: 1}
        lifecycle: {$ref: '#/$defs/lifecycle_active'}
        completion:
          properties:
            disposition: {type: 'null'}
            rationale: {type: 'null'}
  - if: {properties: {status: {enum: [succeeded, partially-succeeded, failed, abandoned]}}, required: [status]}
    then:
      properties:
        completed_at: {type: string, format: date-time}
        outcome: {type: string, minLength: 1}
        lifecycle: {$ref: '#/$defs/lifecycle_terminal'}
        completion:
          properties:
            disposition: {type: string}
            rationale: {type: string, minLength: 1}
$defs:
  lifecycle:
    type: object
    additionalProperties: false
    required: [execute, observe, evaluate, classify, adapt, validate, persist, reuse]
    properties:
      execute: {$ref: '#/$defs/stage'}
      observe: {$ref: '#/$defs/stage'}
      evaluate: {$ref: '#/$defs/stage'}
      classify: {$ref: '#/$defs/stage'}
      adapt: {$ref: '#/$defs/stage'}
      validate: {$ref: '#/$defs/stage'}
      persist: {$ref: '#/$defs/stage'}
      reuse: {$ref: '#/$defs/stage'}
  lifecycle_active:
    allOf:
      - {$ref: '#/$defs/lifecycle'}
      - oneOf:
          - properties: {execute: {properties: {status: {const: in-progress}}}, observe: {properties: {status: {not: {const: in-progress}}}}, evaluate: {properties: {status: {not: {const: in-progress}}}}, classify: {properties: {status: {not: {const: in-progress}}}}, adapt: {properties: {status: {not: {const: in-progress}}}}, validate: {properties: {status: {not: {const: in-progress}}}}, persist: {properties: {status: {not: {const: in-progress}}}}, reuse: {properties: {status: {not: {const: in-progress}}}}}
          - properties: {observe: {properties: {status: {const: in-progress}}}, execute: {properties: {status: {not: {const: in-progress}}}}, evaluate: {properties: {status: {not: {const: in-progress}}}}, classify: {properties: {status: {not: {const: in-progress}}}}, adapt: {properties: {status: {not: {const: in-progress}}}}, validate: {properties: {status: {not: {const: in-progress}}}}, persist: {properties: {status: {not: {const: in-progress}}}}, reuse: {properties: {status: {not: {const: in-progress}}}}}
          - properties: {evaluate: {properties: {status: {const: in-progress}}}, execute: {properties: {status: {not: {const: in-progress}}}}, observe: {properties: {status: {not: {const: in-progress}}}}, classify: {properties: {status: {not: {const: in-progress}}}}, adapt: {properties: {status: {not: {const: in-progress}}}}, validate: {properties: {status: {not: {const: in-progress}}}}, persist: {properties: {status: {not: {const: in-progress}}}}, reuse: {properties: {status: {not: {const: in-progress}}}}}
          - properties: {classify: {properties: {status: {const: in-progress}}}, execute: {properties: {status: {not: {const: in-progress}}}}, observe: {properties: {status: {not: {const: in-progress}}}}, evaluate: {properties: {status: {not: {const: in-progress}}}}, adapt: {properties: {status: {not: {const: in-progress}}}}, validate: {properties: {status: {not: {const: in-progress}}}}, persist: {properties: {status: {not: {const: in-progress}}}}, reuse: {properties: {status: {not: {const: in-progress}}}}}
          - properties: {adapt: {properties: {status: {const: in-progress}}}, execute: {properties: {status: {not: {const: in-progress}}}}, observe: {properties: {status: {not: {const: in-progress}}}}, evaluate: {properties: {status: {not: {const: in-progress}}}}, classify: {properties: {status: {not: {const: in-progress}}}}, validate: {properties: {status: {not: {const: in-progress}}}}, persist: {properties: {status: {not: {const: in-progress}}}}, reuse: {properties: {status: {not: {const: in-progress}}}}}
          - properties: {validate: {properties: {status: {const: in-progress}}}, execute: {properties: {status: {not: {const: in-progress}}}}, observe: {properties: {status: {not: {const: in-progress}}}}, evaluate: {properties: {status: {not: {const: in-progress}}}}, classify: {properties: {status: {not: {const: in-progress}}}}, adapt: {properties: {status: {not: {const: in-progress}}}}, persist: {properties: {status: {not: {const: in-progress}}}}, reuse: {properties: {status: {not: {const: in-progress}}}}}
          - properties: {persist: {properties: {status: {const: in-progress}}}, execute: {properties: {status: {not: {const: in-progress}}}}, observe: {properties: {status: {not: {const: in-progress}}}}, evaluate: {properties: {status: {not: {const: in-progress}}}}, classify: {properties: {status: {not: {const: in-progress}}}}, adapt: {properties: {status: {not: {const: in-progress}}}}, validate: {properties: {status: {not: {const: in-progress}}}}, reuse: {properties: {status: {not: {const: in-progress}}}}}
          - properties: {reuse: {properties: {status: {const: in-progress}}}, execute: {properties: {status: {not: {const: in-progress}}}}, observe: {properties: {status: {not: {const: in-progress}}}}, evaluate: {properties: {status: {not: {const: in-progress}}}}, classify: {properties: {status: {not: {const: in-progress}}}}, adapt: {properties: {status: {not: {const: in-progress}}}}, validate: {properties: {status: {not: {const: in-progress}}}}, persist: {properties: {status: {not: {const: in-progress}}}}}
  lifecycle_terminal:
    allOf:
      - {$ref: '#/$defs/lifecycle'}
      - properties:
          execute: {properties: {status: {enum: [completed, not-applicable]}}}
          observe: {properties: {status: {enum: [completed, not-applicable]}}}
          evaluate: {properties: {status: {enum: [completed, not-applicable]}}}
          classify: {properties: {status: {enum: [completed, not-applicable]}}}
          adapt: {properties: {status: {enum: [completed, not-applicable]}}}
          validate: {properties: {status: {enum: [completed, not-applicable]}}}
          persist: {properties: {status: {enum: [completed, not-applicable]}}}
          reuse: {properties: {status: {enum: [completed, not-applicable]}}}
  stage:
    type: object
    additionalProperties: false
    required: [status, started_at, completed_at, summary, refs, reason]
    properties:
      status: {type: string, enum: [pending, in-progress, completed, not-applicable]}
      started_at: {type: [string, 'null'], format: date-time}
      completed_at: {type: [string, 'null'], format: date-time}
      summary: {type: [string, 'null']}
      refs:
        type: array
        uniqueItems: true
        items: {type: string, minLength: 1}
      reason: {type: [string, 'null']}
    allOf:
      - if: {properties: {status: {const: pending}}, required: [status]}
        then: {properties: {started_at: {type: 'null'}, completed_at: {type: 'null'}, summary: {type: 'null'}, reason: {type: 'null'}}}
      - if: {properties: {status: {const: in-progress}}, required: [status]}
        then: {properties: {started_at: {type: string, format: date-time}, completed_at: {type: 'null'}}}
      - if: {properties: {status: {const: completed}}, required: [status]}
        then: {properties: {started_at: {type: string, format: date-time}, completed_at: {type: string, format: date-time}, summary: {type: string, minLength: 1}}}
      - if: {properties: {status: {const: not-applicable}}, required: [status]}
        then: {properties: {started_at: {type: 'null'}, completed_at: {type: 'null'}, reason: {type: string, minLength: 1}}}
  validation_result:
    type: object
    additionalProperties: false
    required: [rule_id, domain, status, severity, message, artifact_path, evidence_refs, recovery_action]
    properties:
      rule_id: {type: string, pattern: '^[A-Z]+-[A-Z0-9-]+$'}
      domain: {type: string, enum: [operating, repository, implementation]}
      status: {type: string, enum: [passed, failed, pending, not-applicable]}
      severity: {type: string, enum: [info, warning, error, blocker]}
      message: {type: string, minLength: 1}
      artifact_path: {type: [string, 'null']}
      evidence_refs: {type: array, uniqueItems: true, items: {type: string, minLength: 1}}
      recovery_action: {type: [string, 'null']}