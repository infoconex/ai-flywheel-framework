$schema: https://json-schema.org/draft/2020-12/schema
$id: mission.schema.yaml
type: object
required: [schema_version, id, title, status, objective, success_criteria, goals]
properties:
  schema_version: {type: integer, const: 1}
  id: {type: string, minLength: 1}
  title: {type: string, minLength: 1}
  status: {type: string, enum: [proposed, blocked, active, completed, cancelled]}
  objective: {type: string, minLength: 1}
  constraints: {type: array, items: {type: string}}
  success_criteria:
    type: array
    minItems: 1
    items:
      type: object
      required: [id, statement]
      properties:
        id: {type: string, pattern: '^MSC-[0-9]{3,}$'}
        statement: {type: string, minLength: 1}
  goals:
    type: array
    minItems: 1
    uniqueItems: true
    items: {type: string, minLength: 1}