$schema: https://json-schema.org/draft/2020-12/schema
$id: programmatic-capabilities.schema.yaml
type: object
additionalProperties: false
required:
  - schema_version
  - implementation
  - artifact_governed
  - programmatic_operations
properties:
  schema_version:
    type: integer
    const: 1
  implementation:
    type: object
    additionalProperties: false
    required: [name, revision]
    properties:
      name: {type: string, minLength: 1}
      revision: {type: string, minLength: 7}
      interface:
        type: string
        enum: [cli, api, library, mixed]
  artifact_governed:
    type: object
    additionalProperties: false
    required: [supported]
    properties:
      supported: {type: boolean}
      certification_ref: {type: [string, 'null']}
  programmatic_operations:
    type: object
    additionalProperties: false
    required: [supported, operations]
    properties:
      supported: {type: boolean}
      certification_ref: {type: [string, 'null']}
      operations:
        type: array
        uniqueItems: true
        items:
          type: object
          additionalProperties: false
          required: [id, family, mutating, approval_required, atomicity, idempotency, tested]
          properties:
            id: {type: string, pattern: '^[a-z][a-z0-9.-]+$'}
            family:
              type: string
              enum: [mission, goal, execution, lifecycle, record, approval, state, validation, recovery]
            mutating: {type: boolean}
            approval_required: {type: boolean}
            atomicity:
              type: string
              enum: [not-applicable, atomic, recoverable]
            idempotency:
              type: string
              enum: [read-only, replay-safe, resumable, conflict-on-repeat]
            tested: {type: boolean}
            test_refs:
              type: array
              uniqueItems: true
              items: {type: string, minLength: 1}
allOf:
  - if:
      properties:
        programmatic_operations:
          properties:
            supported: {const: true}
    then:
      properties:
        programmatic_operations:
          required: [certification_ref]
          properties:
            certification_ref: {type: string, minLength: 1}
            operations: {minItems: 1}
