[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-flywheel-tools"
version = "0.1.0"
description = "Repository-local AI Flywheel operating and validation CLI"
requires-python = ">=3.11"
dependencies = [
  "PyYAML>=6.0,<7",
  "jsonschema>=4.21,<5",
]

[project.optional-dependencies]
test = ["pytest>=8,<9"]

[project.scripts]
flywheel = "flywheel.cli:main"

[tool.setuptools]
packages = ["flywheel"]

[tool.pytest.ini_options]
testpaths = ["tests"]
