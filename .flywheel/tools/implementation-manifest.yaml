schema_version: 1
implementation_id: python-cli-v0.1.0
status: in-development
approval_ref: APPROVAL-003
language: Python 3
runtime: CPython 3.11 or later
source_location: .flywheel/tools/flywheel
entry_points:
  module: python -m flywheel
  installed: flywheel
package_configuration: .flywheel/tools/pyproject.toml
dependencies:
  runtime:
    - PyYAML
    - jsonschema
  development:
    - pytest
supported_platforms:
  - Windows
  - macOS
  - Linux
implemented_commands:
  - status
  - validate
  - mission list
  - goal list
implemented_capabilities:
  - manifest and required-file validation
  - active state and reference validation
  - filename-to-ID validation
  - filtered mission and goal listing
  - compare-and-swap YAML writes
  - console and JSON-lines structured logging scoped to mission, goal, and execution
planned_before_goal_completion:
  - mission and goal create and update
  - execution create, resume, and update
  - evidence and approval record commands
  - readiness validation command
  - full schema-to-artifact routing and cross-reference validation
known_limitations:
  - This initial slice does not yet implement the complete approved command surface.
  - Validation currently targets startup, required files, state references, and mission/goal path identities.
  - Python and approved dependencies must be installed locally.
hosted_automation_required: false
manual_fallback_preserved: true
